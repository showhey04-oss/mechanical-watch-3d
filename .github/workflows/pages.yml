name: Pages runtime boundary R1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run full Node suite
        run: npm test
      - name: Build runtime-only Pages staging
        run: node scripts/build-pages-site.mjs
      - name: Verify staged package
        run: node --test tests/pages-runtime-publish-boundary.test.mjs
      - name: Configure Pages metadata without deploying
        uses: actions/configure-pages@v6
      - name: Upload runtime-only Pages artifact for R1 review
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

  # R1 intentionally has no deploy job and does not run on pushes to main.
  # Human approval is required before an R2 may add pages/id-token permissions,
  # a github-pages environment, deploy-pages, or a Pages Source change.
