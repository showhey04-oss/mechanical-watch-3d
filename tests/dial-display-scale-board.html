<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 2B dial display scale comparison</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#080b10;color:#f5f7fa}body{padding:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 14px}h1{font-size:21px;margin:0 0 4px}p{font-size:12px;color:#aeb8c6;margin:0}
#board{display:grid;grid-template-columns:repeat(4,var(--card-width));gap:12px}.card{position:relative;width:var(--card-width);height:calc(var(--frame-height) * var(--scale) + 62px);overflow:hidden;border:1px solid #333b47;border-radius:12px;background:#0d1015;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.frameWrap{width:var(--card-width);height:calc(var(--frame-height) * var(--scale));overflow:hidden;background:#0d1015}iframe{display:block;width:var(--frame-width);height:var(--frame-height);border:0;transform:scale(var(--scale));transform-origin:top left;background:#0d1015}
.label{height:62px;padding:8px 10px;border-top:1px solid #333b47;background:#121720}.label b{display:block;font-size:13px;color:#f5dfaa}.label span{font-size:10px;color:#aeb8c6}
body[data-mode="desktop"]{--frame-width:1280px;--frame-height:720px;--scale:.34;--card-width:435.2px}
body[data-mode="mobile"]{--frame-width:390px;--frame-height:844px;--scale:.42;--card-width:163.8px;padding:14px}body[data-mode="mobile"] #board{gap:10px}body[data-mode="mobile"] h1{font-size:17px}body[data-mode="mobile"] header{margin-bottom:10px}
</style>
</head>
<body>
<header><div><h1>Phase 2B 文字板表示系 縮小率候補比較</h1><p id="subtitle"></p></div><p>query限定・既定未採用</p></header>
<main id="board"></main>
<script>
const query=new URLSearchParams(location.search),mode=query.get("mode")==="mobile"?"mobile":"desktop",time=query.get("time")||"10:10:30",overlay=query.get("overlay");
const candidates=[
  {id:"s100",label:"S100",dims:"ring 32.200 / index 29.600"},
  {id:"s92",label:"S92",dims:"ring 29.624 / index 27.232"},
  {id:"s86",label:"S86",dims:"ring 27.692 / index 25.456"},
  {id:"s80",label:"S80",dims:"ring 25.760 / index 23.680"},
];
document.body.dataset.mode=mode;document.getElementById("subtitle").textContent=`${mode==="mobile"?"390×844":"1280×720"} / ${time} / paused / navy / front / opacity 100%`;
for(const candidate of candidates){const card=document.createElement("section");card.className="card";const wrap=document.createElement("div");wrap.className="frameWrap";const frame=document.createElement("iframe");frame.title=candidate.label;frame.src=`../index.html?dialDisplayScale=${candidate.id}&dialDisplayScaleAudit=1${overlay?`&dialDisplayScaleOverlay=${encodeURIComponent(overlay)}`:""}&theme=navy&camera=reset&time=${encodeURIComponent(time)}&paused=1&opacity=1&panel=collapsed&cache=phase2b-board-${mode}-${candidate.id}-${time}-${overlay||"plain"}`;wrap.append(frame);const label=document.createElement("div");label.className="label";label.innerHTML=`<b>${candidate.label} ${candidate.id.slice(1)}%</b><span>${candidate.dims}</span>`;card.append(wrap,label);document.getElementById("board").append(card)}
const frames=[...document.querySelectorAll("iframe")];const waitForReady=()=>new Promise(resolve=>{const check=()=>{const ready=frames.every(frame=>{try{return frame.contentDocument?.querySelector("#renderStatus.done")&&frame.contentDocument?.querySelector("#dialDisplayScaleResult")?.dataset.status==="passed"&&(!overlay||frame.contentDocument?.querySelector(`[data-dial-display-scale-overlay][data-overlay-mode="${overlay}"]`))}catch{return false}});ready?resolve():requestAnimationFrame(check)};check()});waitForReady().then(()=>{document.body.dataset.ready="true"});
</script>
</body>
</html>
