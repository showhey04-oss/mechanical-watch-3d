<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 2C Y-stack audit harness</title>
<style>
html,body{margin:0;min-height:100%;background:#11151b;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{display:grid;gap:12px;padding:16px;max-width:1320px;margin:0 auto}
h1{font-size:18px;margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{min-height:38px;border:1px solid #6c7c91;border-radius:6px;background:#1d2936;color:#eef2f7;padding:0 12px;font:inherit;cursor:pointer}.controls button:focus-visible{outline:3px solid #f5cf72;outline-offset:2px}
#phase2cStatus{font-weight:700}#phase2cSummary{margin:0;padding:12px;background:#0d1015;border:1px solid #293747;white-space:pre-wrap;overflow:auto;max-height:260px}#phase2cAuditResult{display:none}
#auditApp{display:block;border:0;background:#0d1015;max-width:100%;box-shadow:0 0 0 1px #293747}#downloads{display:flex;gap:8px;flex-wrap:wrap}#downloads a{color:#9cd4ff}
</style>
</head>
<body>
<main>
<h1>Phase 2C — Y方向基準面・厚さレイヤー監査</h1>
<div class="controls" aria-label="監査実行">
<button id="runDesktop" type="button">desktop 1280×720 を実行</button>
<button id="runMobile" type="button">mobile 390×844 を実行</button>
<button id="runComparison" type="button">desktop / mobile 比較を実行</button>
</div>
<output id="phase2cStatus" aria-live="polite">idle</output>
<pre id="phase2cSummary"></pre>
<script id="phase2cAuditResult" type="application/json">{}</script>
<div id="downloads" aria-label="監査JSONダウンロード"></div>
<iframe id="auditApp" title="Mechanical Watch Study Model Phase 2C Y-stack audit"></iframe>
</main>
<script type="module" src="./y-stack-audit-harness.js"></script>
</body>
</html>
