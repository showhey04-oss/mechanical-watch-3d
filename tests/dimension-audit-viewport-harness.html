<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Dimension audit fixed viewport harness</title></head>
<body>
<output id="dimensionHarnessResult">running</output>
<iframe id="target" width="1280" height="720" style="position:fixed;left:-2000px;top:0;border:0" src="../index.html?dimensionAudit=1&amp;dimensionAuditTest=1&amp;theme=navy&amp;camera=reset&amp;time=10%3A10%3A30&amp;paused=1&amp;opacity=1&amp;panel=collapsed&amp;cache=dimension-fixed-viewport"></iframe>
<script type="module">
const frame=document.getElementById("target");
const result=await new Promise((resolve,reject)=>{
  const started=performance.now();
  const check=()=>{
    const output=frame.contentDocument?.querySelector("#dimensionAuditTestResult");
    if(output?.dataset.status)return resolve(JSON.parse(output.textContent));
    if(performance.now()-started>20000)return reject(new Error("dimension audit timeout"));
    requestAnimationFrame(check);
  };
  check();
});
const output=document.getElementById("dimensionHarnessResult");output.value=JSON.stringify(result);output.textContent=JSON.stringify(result);output.dataset.status=result.ok?"passed":"failed";
window.dimensionHarnessResult=result;
</script>
</body>
</html>
