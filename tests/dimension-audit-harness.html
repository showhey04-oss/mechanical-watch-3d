<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dimension audit viewport harness</title>
<style>
html,body{margin:0;min-height:100%;overflow:hidden;background:#11151b;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{display:block;margin:0;padding:0}
h1,p{display:none}
iframe{position:fixed;top:62px;left:0;display:block;border:0;background:#0d1015}
</style>
</head>
<body>
<main>
<h1 id="title">Dimension audit</h1>
<p id="state"></p>
<iframe id="auditApp" title="Mechanical Watch Study Model dimension audit"></iframe>
</main>
<script>
const query = new URLSearchParams(location.search);
const width = Math.max(1, Number(query.get("width")) || 1280);
const height = Math.max(1, Number(query.get("height")) || 720);
const view = query.get("view") || "reset";
const appQuery = query.get("appQuery");
const frame = document.getElementById("auditApp");
frame.width = width;
frame.height = height;
frame.style.width = `${width}px`;
frame.style.height = `${height}px`;
frame.src = appQuery
  ? `../index.html?${appQuery}`
  : `../index.html?dimensionAudit=1&theme=navy&camera=${encodeURIComponent(view)}&time=10%3A10%3A30&paused=1&opacity=1&panel=collapsed&cache=${encodeURIComponent(query.get("cache") || "dimension-audit")}`;
document.getElementById("state").textContent = `${width}×${height} / ${view}`;
</script>
</body>
</html>
