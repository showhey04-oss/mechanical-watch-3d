<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 2C desktop offscreen capture</title>
<style>
html,body{margin:0;min-height:100%;background:#10141b;color:#eef3ff;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
main{padding:8px}iframe{display:block;width:1280px;height:720px;border:1px solid #52627a;background:#0d1015}pre{white-space:pre-wrap}
</style>
</head>
<body data-audit-status="idle" data-capture-stage="idle" data-desktop-capture-ready="false">
<main>
<iframe id="auditApp" title="Phase 2C desktop runtime reference"></iframe>
<pre id="captureResult"></pre>
<pre id="captureLog"></pre>
<div id="phase2cCaptureChunks" hidden></div>
</main>
<script type="module">
import {runCapture} from './y-stack-audit-capture.js';
runCapture({captureId:'desktop-side',width:1280,height:720,readyKey:'desktopCaptureReady'});
</script>
</body>
</html>
